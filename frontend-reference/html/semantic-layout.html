<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semantic Layout Reference</title>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <!-- Add links that navigate to related pages. -->
    </nav>
  </header>

  <main>
    <section>
      <h1>Page heading</h1>
      <!-- Add content that belongs to this section. -->
    </section>

    <article>
      <h2>Standalone content</h2>
      <!-- An article should make sense when separated from the page. -->
    </article>
  </main>

  <footer>
    <!-- Add supporting site information here. -->
  </footer>
</body>
</html>
