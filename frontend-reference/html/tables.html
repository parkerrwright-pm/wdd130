<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table Reference</title>
</head>
<body>
  <main>
    <h1>Table example</h1>
    <table>
      <caption>Example data</caption>
      <thead>
        <tr>
          <th scope="col">Item</th>
          <th scope="col">Value</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Example</th>
          <td>Replace with related data</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
